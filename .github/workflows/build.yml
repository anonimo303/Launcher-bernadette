name: Build APK
on:
  workflow_dispatch:
  push:
    branches: ['**']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descomprimir
        run: unzip -o launcher_bernadette.zip -d proyecto
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compilar
        run: cd proyecto && gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: launcher-apk
          path: proyecto/app/build/outputs/apk/debug/*.apk
